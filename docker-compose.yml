services:
  model-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: >
      sh -c "gunicorn
      --workers ${MODEL_SERVER_WORKERS:-1}
      --threads ${MODEL_SERVER_THREADS:-2}
      --timeout ${MODEL_SERVER_TIMEOUT:-180}
      --bind 0.0.0.0:${BIRDNET_SERVICE_PORT:-5001}
      model_service.inference_server:app"
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./data/flags:/app/data/flags
    environment:
      - PYTHONPATH=/app
      - BIRDNET_SERVICE_PORT=5001
      - MODEL_SERVER_WORKERS=1
      - MODEL_SERVER_THREADS=2
      - MODEL_SERVER_TIMEOUT=180
      - LOG_FORMAT=human
      - LOG_LEVEL=INFO
    ports:
      - "127.0.0.1:5001:5001"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: >
      sh -c "gunicorn
      --worker-class eventlet
      --workers ${API_WORKERS:-1}
      --worker-connections ${API_WORKER_CONNECTIONS:-1000}
      --bind 0.0.0.0:${API_PORT:-5002}
      core.wsgi:app"
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./data/flags:/app/data/flags
    environment:
      - PYTHONPATH=/app
      - API_PORT=5002
      - API_WORKERS=1
      - API_WORKER_CONNECTIONS=1000
      - LOG_FORMAT=human
      - LOG_LEVEL=INFO
    ports:
      # Bind to localhost only - nginx proxies external requests via docker network
      # This prevents direct access to internal endpoints like /api/broadcast/detection
      - "127.0.0.1:5002:5002"

  main:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: python -m core.main
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./data/flags:/app/data/flags
      # PulseAudio socket for audio access
      # birdnet-service.sh ensures /run/pulse/native exists (system-wide or symlink to user socket)
      - /run/pulse:/run/pulse:ro
    environment:
      - PYTHONPATH=/app
      - PULSE_SERVER=unix:/run/pulse/native
      - LOG_FORMAT=human
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - model-server
      - api

  icecast:
    build:
      context: ./deployment/audio
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    volumes:
      # PulseAudio socket for audio access
      # birdnet-service.sh ensures /run/pulse/native exists (system-wide or symlink to user socket)
      - /run/pulse:/run/pulse:ro
      # User settings for RTSP URL configuration
      - ./data:/app/data:ro
    environment:
      - PULSE_SERVER=unix:/run/pulse/native
      - ICECAST_PASSWORD=${ICECAST_PASSWORD:-}
      - STREAM_BITRATE=${STREAM_BITRATE:-320k}
      - TZ=UTC
    ports:
      # Bind to localhost only - nginx proxies /stream/ requests via docker network
      # This enforces authentication via nginx auth_request
      - "127.0.0.1:8888:8888"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - TZ=UTC
    depends_on:
      - api
    
